openapi: 3.0.4
info:
  title: Odontia API
  description: "API REST de Odontia (gestión odontológica multi-consultorio).\n\n**Autenticación:** `POST /api/v1/auth/login` devuelve un access token JWT (enviar como `Authorization: Bearer <token>`)\ny establece el refresh token en una cookie HttpOnly. Renovar con `POST /api/v1/auth/refresh` enviando el\nencabezado `X-CSRF-Token` (valor recibido en `csrfToken`).\n\n**Permisos:** cada operación indica el permiso requerido en el consultorio activo.\n**Errores:** formato ProblemDetails con `code`, `traceId` y, en validaciones, `errors`."
  version: '1.0'
paths:
  /api/v1/agenda:
    get:
      tags:
        - Agenda
      summary: 'Agenda de un rango de fechas locales (día o semana; máx. 42 días), por profesional y/o consultorio físico.'
      description: '**Permisos requeridos:** `agenda.read`'
      operationId: agendaGet
      parameters:
        - name: From
          in: query
          schema:
            type: string
            format: date
        - name: To
          in: query
          schema:
            type: string
            format: date
        - name: ProfessionalUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: GabineteId
          in: query
          schema:
            type: string
            format: uuid
        - name: IncludeCancelled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaDto'
        '400':
          description: 'Datos inválidos (`validation_error`, con `errors` por campo).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          description: 'No autenticado o sesión invalidada (`unauthorized`, `session_invalidated`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: 'Sin permiso o sin consultorio activo (`forbidden`, `membership_inactive`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Demasiadas solicitudes (`rate_limited`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      security:
        - Bearer: [ ]
      x-permissions:
        - agenda.read
  /api/v1/agenda/month:
    get:
      tags:
        - Agenda
      summary: 'Vista mensual: cantidad de turnos por día y primeros turnos.'
      description: '**Permisos requeridos:** `agenda.read`'
