          description: 'Sin permiso o sin consultorio activo (`forbidden`, `membership_inactive`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Demasiadas solicitudes (`rate_limited`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      security:
        - Bearer: [ ]
      x-permissions:
        - users.manage
    post:
      tags:
        - Users
      summary: Invita por correo a un usuario con los roles indicados.
      description: '**Permisos requeridos:** `users.manage`'
      operationId: usersInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDto'
        '400':
          description: 'Datos inválidos (`validation_error`, con `errors` por campo).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          description: 'No autenticado o sesión invalidada (`unauthorized`, `session_invalidated`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: 'Sin permiso o sin consultorio activo (`forbidden`, `membership_inactive`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: 'Conflicto: duplicado, horario ocupado o versión desactualizada (`slot_taken`, `concurrency_conflict`, …).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: Regla de negocio incumplida (el `detail` es apto para mostrar al usuario).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Demasiadas solicitudes (`rate_limited`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      security:
        - Bearer: [ ]
      x-permissions:
        - users.manage
  '/api/v1/invitations/{id}':
    delete:
      tags:
        - Users
      description: '**Permisos requeridos:** `users.manage`'
      operationId: usersRevokeInvitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: 'No autenticado o sesión invalidada (`unauthorized`, `session_invalidated`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: 'Sin permiso o sin consultorio activo (`forbidden`, `membership_inactive`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '404':
          description: No existe o pertenece a otro consultorio (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: 'Conflicto: duplicado, horario ocupado o versión desactualizada (`slot_taken`, `concurrency_conflict`, …).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: Regla de negocio incumplida (el `detail` es apto para mostrar al usuario).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          description: Demasiadas solicitudes (`rate_limited`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
      security:
        - Bearer: [ ]
      x-permissions:
        - users.manage
