# nginx para el frontend de Odontia. Corre como usuario "nginx" (sin root).
# La compresión gzip y TLS los hace Caddy (miaula-web-1); aquí solo se sirven estáticos.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporales en /tmp porque el proceso no es root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Los redireccionamientos internos no deben apuntar a http://host:80.
    absolute_redirect off;

    # Caché según la URI final (tras el fallback de SPA la URI es /index.html):
    # - recursos con hash en el nombre (main-ABCD1234.js, styles-XXXX.css, media/...): un año, inmutables;
    # - index.html: siempre se revalida, para que apunte a los recursos con hash vigentes;
    # - resto (favicon, etc.): una hora.
    map $uri $odontia_cache {
        "~*-[A-Za-z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$" "public, max-age=31536000, immutable";
        /index.html "no-cache";
        /           "no-cache";
        default     "public, max-age=3600";
    }

    server {
        listen 80;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # Cabeceras comunes a toda respuesta (también errores, por "always").
        # Ninguna location define add_header propio: si lo hiciera, dejaría de heredar estas.
        add_header Cache-Control "$odontia_cache" always;
        # CSP de la SPA. Requisitos verificados sobre el build de producción (ng build):
        # - sin scripts en línea: angular.json desactiva optimization.styles.inlineCritical (si no, Angular
        #   agrega un <script> en línea y un <link media="print"> que esta política bloquearía: la app
        #   quedaría sin estilos);
        # - style-src 'unsafe-inline': Angular inyecta los estilos de los componentes con elementos <style>;
        # - la API está en el mismo origen (/api), así que connect-src 'self' alcanza.
        # Si se agregan recursos de otro origen (fuentes, analytics, mapas), hay que sumarlos aquí.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /index.html {
        }

        # Recursos con hash: si no existen, 404 (nunca el index.html con tipo incorrecto).
        location ~* "-[A-Za-z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$" {
            try_files $uri =404;
        }

        # Resto: archivo si existe; si no, fallback de SPA a index.html (no-cache por la URI final).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
