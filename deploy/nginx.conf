# nginx para el frontend de Odontia. Corre como usuario "nginx" (sin root).
# La compresión gzip y TLS los hace Caddy (miaula-web-1); aquí solo se sirven estáticos.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temporales en /tmp porque el proceso no es root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Los redireccionamientos internos no deben apuntar a http://host:80.
    absolute_redirect off;

    server {
        listen 80;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        # Nota: add_header no se hereda si la location define los suyos; por eso se repiten.

        # index.html nunca se guarda en caché: siempre apunta a los recursos con hash vigentes.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }

        # Recursos con hash en el nombre (main-ABCD1234.js, styles-XXXX.css, media/...): caché larga.
        location ~* "-[A-Za-z0-9]{8,}\.(?:js|mjs|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|webp|avif|ico)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Resto: archivo si existe; si no, fallback de SPA a index.html (hereda no-cache).
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
