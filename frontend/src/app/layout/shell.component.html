<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.5c2.1-.8 3.5.6 5 .6s2.9-1.4 5-.6c2.8 1.1 3.1 4.1 2 6.9-.7 1.7-1.4 3.1-1.9 5.2-.4 1.7-.9 3.5-2.2 3.5-1.1 0-1.3-2.1-1.9-3.8-.3-1-.5-1.5-1-1.5s-.7.5-1 1.5c-.6 1.7-.8 3.8-1.9 3.8-1.3 0-1.8-1.8-2.2-3.5-.5-2.1-1.2-3.5-1.9-5.2C3.9 7.6 4.2 4.6 7 3.5Z"/></svg></span>
      <span class="brand-text"><strong>Odentix</strong><small>Gestión odontológica</small></span>
    </a>

    <nav class="main-navigation" aria-label="Navegación principal">
      @for (grupo of grupos(); track grupo.titulo) {
        <p class="navigation-heading">{{ grupo.titulo }}</p>
        @for (opcion of grupo.opciones; track opcion.ruta) {
          <a class="navigation-link" [routerLink]="opcion.ruta" routerLinkActive="active" [title]="opcion.titulo">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="opcion.icono"/></svg>
            <span>{{ opcion.titulo }}</span>
          </a>
        }
      }
    </nav>

    <div class="user-card">
      <span class="user-avatar" aria-hidden="true">{{ iniciales() }}</span>
      <span class="user-information"><strong>{{ nombre() }}</strong><small>{{ detalle() }}</small></span>
      <button type="button" class="logout-button" (click)="salir()" [disabled]="saliendo" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M14 8l4 4-4 4M18 12H9"/></svg>
      </button>
    </div>
  </aside>

  <div class="shell-content">
    <router-outlet />
  </div>
</div>
