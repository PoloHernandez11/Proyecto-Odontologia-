<main class="settings-page"><header><a routerLink="/dashboard" [queryParams]="{perfil: perfil}">← Volver al inicio</a><span>ODONTIA · CUENTA</span></header><section class="settings-card"><span class="eyebrow">PERFIL Y CONFIGURACIÓN</span><h1>Mi perfil</h1><p>Modificá tus datos y el perfil con el que utilizás Odontia.</p><form #formulario="ngForm" (ngSubmit)="guardar()"><label>Nombre completo<input name="nombre" [(ngModel)]="nombre" required minlength="2" autocomplete="name"></label><label>Correo electrónico<input name="correo" type="email" [(ngModel)]="correo" required email autocomplete="email"></label><label>Perfil activo<select name="perfil" [(ngModel)]="perfil"><option value="secretaria">Secretaría</option><option value="odontologo">Odontóloga</option></select></label><button type="submit" [disabled]="formulario.invalid">Guardar cambios</button></form><p class="success" role="status" *ngIf="mensaje">{{ mensaje }}</p><p class="error" role="alert" *ngIf="error">{{ error }}</p><small>Los cambios se guardan en este navegador para esta demostración. No modifica credenciales ni permisos reales.</small></section></main>
